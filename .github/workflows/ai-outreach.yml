name: 🤖 AI Outreach — Reddit Monitor + Backlink Discovery

on:
  schedule:
    # Roz 2 baar: 5:30 UTC (11 AM IST) aur 14:30 UTC (8 PM IST)
    - cron: '30 5 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:  # Manual button bhi

jobs:
  ai-outreach:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🟢 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          pip install groq httpx requests
      
      - name: 🤖 Run AI outreach
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI_OUTREACH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ai-outreach.py
      
      - name: 📤 Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-report-${{ github.run_number }}
          path: outreach-reports/
          retention-days: 30