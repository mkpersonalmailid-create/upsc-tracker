<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internet Offline</title>
    <style>
      body {
        font-family: sans-serif;
        background: #0f172a;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .box {
        background: #1e293b;
        padding: 40px;
        border-radius: 10px;
      }
      h1 {
        margin-top: 0;
      }
      button {
        padding: 10px 20px;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>📡 Internet Nahi Hai</h1>
      <p>Bhai, net check karo aur wapas try karo.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
